# best-game-01: "Make the best game", judged by the house AI judge on a dossier (program/v1 + harness.judge, media
# dossier, a screened final). It landed first sealed as status: draft / visibility: internal (new-bounty SKILL.md
# 8.3), off production's seed catalogue, so dev seeded it on its shipped status and an admin saw its page before the
# opening (https://dev.make.fun/bounty/best-game-01, 2026-11-15T14:40Z). The open seal (SKILL.md 8.7), on the owner's
# answer of 2026-11-15, "Open 18:00 UTC today, or as soon as ready": status open and visibility public, a block of its
# own in production's seed catalogue (deploy/k8s/overlays/makefun-prod/seed-catalogue.txt) and its catalogue row
# (tests/unit/catalogue.test.ts OPENED_IN_TURN), SHIPPED_BUNDLE_SHA256 pinned last; the opening kept the sealed dates.
#
# The owner's ask, 2026-11-15, verbatim: "like this one https://make.fun/bounty/threejs-fps-02 but let's remove the
# threejs and fps constraint - let's just say "make the best game" as the challenge, $1,000 and it runs for 3 days". So
# this bundle is threejs-fps-02 with the three.js and first-person-shooter constraints taken out: any genre of game
# that plays offline in a desktop browser from static files under game/ (game/index.html), with keyboard and mouse and
# no network request, any JavaScript library vendored under game/ (three.js, Phaser, PixiJS, a WebAssembly build as an
# asset) or none; the same $1,000 ten-place table, entries open 72 hours. Every sentence of threejs-fps-02 was
# refreshed for it, and its stale lines left behind: the judge reading each source whole up to 160 KiB (a dossier heat
# sends the dossier-view/v1 view: .cosmos/rules/contest-design.mdc, judge-heat.mdc), the Transcripts section's "never
# published" sentence, "the game's files are the owner's and admins' alone at every time" (the top 3 are hosted:
# below), WebGL 2 in the prerequisites, and the Transcript gate lines (today's, printed below).
#
# What wins, and what it beats. The public starting points for a browser game are the engines' own templates and
# examples (Phaser's project templates, three.js's examples, PixiJS's demos) and the game-jam archives (js13kGames,
# Ludum Dare and itch.io HTML5 jams): a template is a scaffold with no game in it, an engine example shows one feature,
# and a jam game is finished in 48 hours or 13 KB, most with one level, no restart, no sound and no tuning. An entry
# here must be a complete, original, OSI-licensed game that runs offline from its own static files: a goal, rules,
# responsive controls, a way to win, lose or score, a start and a restart and feedback on every action, with its own
# idea, art, sound and names. The winner is a playable open-source game and a reusable base for web games, played live
# from make.fun's site (the top 3 are hosted: below) and featured in its posts.
#
# Each entry's program, main.ts (Node 22), hands in a game it built: it copies game/ (the playable game as static
# files) and screenshots/ (3 or 4 PNG or JPEG screens) from its repository to /output, and writes /output/dossier.json
# with vendor/makefun-game.ts buildDossier, the library the kit ships (sdk/game/makefun-game.ts, a fork of
# sdk/threejs/makefun-threejs.ts without three.js and with the same buildDossier, byte for byte the scorer's own copy).
# The sealed gate (scorer/score.ts, its limits reference/gate.json) checks five rows and writes valid from the first
# four; the judge, superbot at reasoning_effort high on superbot-router, reads two entries at a time, each as its
# dossier's dossier-view/v1 view (server/judging/dossier-view.ts at dossierViewBudgetOf's 1,536 input tokens an entry:
# one JPEG contact sheet of every screenshot, the cover on top, then an outline of the source, each file's path, size
# and declarations), never the whole source, and picks one with a margin from 1 to 5 (verdict v2); the entries rank by
# win rate (resolution.method judges). Its output budget, reasoning included, is max_output_tokens 17200: 1.5 x the p99
# of the output tokens an attempt took in the first calibration (below; p50 1,174, p90 4,375, p99 11,456, the most
# 12,100, the cap then), house-models.mdc's and contest-sizing.mdc's sizing; the rules quote it. The top 5 of the
# settled final heat are held up to 60 minutes for the make.fun team's finalist review (harness.judge.review), which
# plays each by serving game/ with a static file server and opening index.html in desktop Chrome.
#
#   scorer/            score.ts (the five rows: game_files, references, screenshots and dossier_matches decide validity,
#                      js_parses is shown only), images.ts (PNG and JPEG reading), makefun-game.ts (the game reader and
#                      buildDossier, sdk/game/makefun-game.ts byte for byte) and vendor/acorn.mjs (acorn 8.19.0,
#                      pinned by its sha256) with vendor/LICENSE (acorn's MIT): threejs-fps-02's gate without its
#                      three_js row and with the import map optional (one at most, and usable, else references fails);
#                      its references row takes what a bundler's output and an Emscripten build hold: a data: URI
#                      passes anywhere, a root-relative path (Vite's /assets/index-abc.js) is read from game/'s root,
#                      as a static server serves game/, and a dynamic import('node:…') or of an unmapped bare
#                      specifier (Emscripten's import('module')) is passed over, while a static node: or unmapped bare
#                      import, an absolute URL and a protocol-relative //host one fail; it checks only the scripts and
#                      modules index.html reaches (its classic and module scripts and modulepreload links, then each
#                      .js or .mjs file under game/ one of them imports, re-exports or import()s by a literal), so the
#                      rest of a library vendored whole is never read, and its detail counts the files left unchecked
#                      and the dynamic imports passed over; it never follows what a game loads at run time (a Worker,
#                      importScripts, an audio worklet, an injected script, a fetch), which the finalist review plays.
#   reference/         gate.json: threejs-fps-02's limits without the three.js digests: game/ at most 993 files and
#                      directories together and 48 MiB in all, each path at most 1,000 UTF-8 bytes, game/index.html a
#                      regular file of at most 1 MiB, 3 to 4 screenshots of at most 256 KiB, long side at most 1280
#                      and short side at least 480 pixels, the dossier at most 1.5 MiB and its text at most 163,840
#                      bytes (160 KiB).
#   judge/prompt.txt   the judge's persona and its rubric, five genre-neutral criteria ranked most important first (a
#                      complete game; fun and depth; feel and polish; look and originality; structure) and the
#                      close-pair rule, published word for word in the rules. Criteria 1 and 5 ask only what the view
#                      shows, revised after the first calibration (below): 1 wants every part of a complete game shown
#                      in screenshots of the game itself, and 5 judges the structure the outline shows (the game's own
#                      source split into files with one clear job each, named for what they do), since the judge sees
#                      file headings and declarations, rarely code, and an engine build the rules invite keeps its
#                      code under vendor/, out of the outline.
#   judge/anchors/     the four house games, weak to strong (1-weak, 2-plain, 3-mid, 4-strong), each a dossier as an
#                      entry writes one; 2-plain is the starter's own dossier, byte for byte.
#   ladder/            the calibrated dev ladder (harness.judge.ladder): calibration.json and rungs/5-pro.json,
#                      rungs/6-elite.json and rungs/7-ace.json; the screen and the provisional heats read it, the final
#                      heat's games never do.
#   starter/           a working entry laid out as an entrant's repository (main.ts, serve.ts, vendor/makefun-game.ts,
#                      game/, three screenshots, shots.json and its LICENSE): a plain, complete 2D canvas
#                      dodge-and-collect game whose dossier is byte for byte house game 2-plain, so handed in unchanged
#                      it plays as that game.
#
# The house games: seven original games written for this bundle, each laid out as an entry (game/, shots.json,
# screenshots/), every name, picture and sound their own, made in code. Weakest first:
#   1-weak    Square (scripts/best-game/house/1-weak): a click toy, not a game: a grey page, one grey square button
#             and a counter; no goal, no end, no restart. 2 files, 1,600 bytes; screenshots 1-start, 2-play, 3-later.
#   2-plain   Block Dodger (the starter): a plain, complete 2D canvas dodge-and-collect game in plain ES modules: a
#             paddle dodges falling blocks and catches coins, a title screen with the best score, score, level and
#             lives HUD, a level every 12 s to level 12, pause, game over and restart, the best score kept in
#             localStorage; flat colours, no sound, no particles. 8 files, 22,260 bytes; 1-start, 2-play, 3-end.
#   3-mid     Sparkward (scripts/best-game/house/3-mid): a top-down 2D canvas arena shooter: growing waves of three
#             enemy kinds (drifter, spitter, brute), spread-shot and heal pickups, a title with the game playing behind
#             it, score, best, wave and health HUD, wave banners, game over with stats and restart; particles and
#             shake, no sound; a fixed 60 Hz step and object pools. 13 files, 41,393 bytes; 1-play, 2-title, 3-over.
#   4-strong  Mosslight (scripts/best-game/house/4-strong): a pixel-art side-scrolling platformer drawn at 320x180 and
#             scaled 4x: four hand-built levels each with its own art and hazards, four enemy kinds, embers, hidden
#             sunstones and lantern checkpoints, coyote time and jump buffering, WebAudio sound, a title that is the
#             level select with saved progress, pause, level-clear, game-over and win screens. 22 files, 109,250
#             bytes; 1-play, 2-caverns, 3-title, 4-win.
#   5-pro     Sunsprint: The Heliotrope Tour (scripts/best-game/house/5-pro): a three.js solar-car racer across
#             the Dusk Belt: five circuits (a sunset strand, a lantern city, a frozen pass, a lava caldera and salt
#             flats under a giant's ribs), sun powers (Sunburst, Flare Lance, Prism Ward, Cinder Trail) charged by
#             sunshards, drifts and slipstreams, rivals that fire their own, four event kinds (circuit race, Dusk Fall
#             knock-out, Sun Chase time trial, Warden Duel against a region boss), a career of 5 regions x 3 events
#             and 45 stars with purses and five warden bosses, a tuning tree of 4 branches x 3 tiers of opposed parts,
#             tour map, briefing, garage and results screens, progress saved in localStorage. 58 files, 2,394,334
