# Every screenshot is a real render of the game's own code, never cropped, edited or composited: each game draws its
# shot scenes deterministically from ?shot=<scene>&seed=<n> (a seeded generator, fixed simulated time, no wall clock)
# and the renderer takes the 1280x720 viewport as a JPEG of at most 262,144 bytes once window.__shotReady is set, in
