#   6-elite   Gloamvault (scripts/best-game/house/6-elite): a 2D pixel-art roguelite dungeon crawler: three procedural
#             floors of room graphs, 8 foe kinds with elites and flow-field pathing, 3 bosses with phases, 23 relics
#             with trade-offs, a shop, altars and keys, lantern lighting, hit-stop, shake and particles, WebAudio
#             effects and a sequenced score, minimap, title, pause, death and victory screens with a run summary.
#             24 files, 192,073 bytes; 1-fight, 2-boss, 3-title, 4-victory.
#   7-ace     Gloamward (scripts/best-game/house/7-ace): a three.js tower-defence game on floating hex islands at
#             night where light is the ground you fight on (build only where it is lit; some foes are hit only in
#             light, others snuff it): 5 generated islands and 57 waves, a tutorial, 6 works with upgrades and two
#             final forms each, 9 enemy kinds and a 3-phase final boss, abilities and boons, three difficulties,
#             settings, a guide, generative WebAudio music, pause, Victory and Defeat screens with stars, five stats
#             and Play again; its simulation a pure 1/60 s fixed step apart from rendering. 43 files, 2,412,957
#             bytes (three.js vendored as 5-pro's); 1-play, 2-title, 3-boss, 4-victory.
# The two lower rungs hold the slots their measured strength gives them: Sunsprint was 6-elite and Gloamvault 5-pro
# until calibration run 2 measured the racer below the roguelite (below), and the directories swapped before run 3
