    description: Each valid entry is judged as it arrives against the four fixed house games and 8 more games against the house games nearest its strength, with 2 more house-only rounds when its rate reaches the money-place line; the top 100 by that rate also play up to 8 sealed games against one another, and the board's rates count them. Its provisional rate shows at once with its 90% interval and its screenshots on the Feed. A provisional rate is never weighed; the final heat judges every final entry afresh.
    starts_at: "2026-11-15T18:00:00Z"
    ends_at: "2026-11-18T18:00:00Z"
    scores: live
  - key: final
    title: Final
    description: After the deadline every final entry is screened on its dev rating; the shortlist plays 3 Swiss rounds, racing at the prize boundaries, then a playoff, and the top 5 are held for the finalist review. Its rates appear with the results, published automatically once the final grades, the judge heat and the checks after them are done.
    starts_at: "2026-11-18T18:10:00Z"
    ends_at: "2026-11-19T06:10:00Z"
    scores: after_finalize

leaderboard:
