# The judge view. A dossier heat sends each entry's dossier-view/v1 view, never the dossier whole: at 1,536 input tokens
# an entry the screenshots go on one contact sheet (1,120 tokens) and the outline has the rest, (1,536 - 1,120) x 3 =
# 1,248 bytes as escaped in the request's JSON. So the judge sees the game mostly through its screenshots, and the rules
# say so (the dossier and judge sections, the size tips). Their screenshot tip says the judge weighs whether the
# screenshots show the whole loop (a start or title screen, play, and a win, loss or results screen with its restart):
# of run 3's 168 reasons (ladder/calibration.json), 137 name a start, title, end or restart screen by the word, 145 to
# 154 by wider readings (game over, victory, results, play again), so "more than four in five". threejs-fps-02, screenshot-led like this one, kept 95% of
# whole-dossier verdicts at 1,536 in the paired replay (server/judging/dossier-view-budget.ts). A judge call is the
# prompt, the house suffix and two views, held to JUDGE_CALL_INPUT_TOKENS_MAX 5,120 (the preflight's judge-call-budget
# row).
#
# The heat. Ten paid places, so the playoff is left unnamed: the last paid place and 2 more (judgePlayoffPlaces: 12),
# which load.ts judgePlayoffIssue takes. A new house bundle opts in to the screened final (harness.judge.screened: {}),
# which needs the calibrated ladder: its shortlist line sits at place 40, max(shortlist_per_paid 4 x the last paid place
# 10, shortlist_min 32), so every playoff place is inside it. 3 Swiss rounds, the count every simulated screened figure
# plays (judge-screened.mdc); playoff_repeats 1, as threejs-fps-02 and token-radar-01, so each pair of the 12 plays
# once, then top_repeats 3 more games between the top two. The dev phase plays the four anchors once each, then 2
# adaptive rounds of 4 games over the seven ladder members nearest even (12 games, 24 calls), and 2 more such rounds
# (screened.dev_rounds) for an entry whose interval reaches the money-place line (40 calls): house-only, as every dev
# ladder game. Contender rounds are off (screened.contender_games 0): the screen's house-only floor makes them buy the
# final no saving. Contend is on (harness.judge.contend {band: 100, games: 8, top: 20}; contracts/competition.ts
# programJudgeIssues accepts it on a dossier bundle: it asks for a ladder, one named judge model, no harness.pack and
# contender_games 0, and names no medium): the dev board's top 100 by house-only rate play up to 8 sealed games each
# against one another on the same judge, their board rates counting them; 8 games, not 12, because a 72-hour window's
# churn through the band multiplies the calls (judging.md, "Contend": band 100 at 8 games kept most of the gain at
# about 4.4-5% of the dev calls). superbot is dialled on superbot-router alone and a router heat sends each call once
# (grader/judge-backup.ts judgeBackupRuleOf); an answer with no verdict is asked once more (grader/judge-call.ts
# JUDGE_CALL_ATTEMPTS 2). The rules say so.
#
